<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review Booster — Apni Google rating badhao</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
:root{
  --cream:#FBF7F0; --ink:#16271D; --ink-soft:#42554a;
  --gold:#E0A526; --gold-bright:#F4B62E; --green:#2E6B4F; --green-bright:#37855f;
  --red:#C0492F; --card:#FFFFFF; --border:#E7DECE; --shadow:0 10px 40px -12px rgba(22,39,29,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Hanken Grotesk',sans-serif;background:var(--cream);color:var(--ink);
  line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 8%,rgba(224,165,38,.06),transparent 40%),radial-gradient(circle at 88% 92%,rgba(46,107,79,.06),transparent 42%);
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.btn{font-family:'Hanken Grotesk';font-weight:700;font-size:16px;border:none;border-radius:14px;
  padding:14px 26px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold-bright);color:var(--ink);box-shadow:0 6px 0 #c8901c}
.btn-gold:hover{box-shadow:0 8px 0 #c8901c;transform:translateY(-2px)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-bright)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea{font-family:'Hanken Grotesk';font-size:16px;width:100%;padding:13px 15px;border:1.5px solid var(--border);
  border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
label{font-weight:600;font-size:14px;display:block;margin:0 0 6px;color:var(--ink-soft)}
.field{margin-bottom:16px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.muted{color:var(--ink-soft)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.3px}
.pill-trial{background:#FCEFCB;color:#8a6a12}
.pill-active{background:#D6EEE0;color:#1f6043}
.pill-expired{background:#F6D9D1;color:#9c3520}
.hide{display:none!important}
/* nav */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:rgba(251,247,240,.82);border-bottom:1px solid var(--border)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-family:'Fraunces';font-weight:900;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo .star{color:var(--gold)}
/* hero */
.hero{padding:70px 0 40px;position:relative}
.hero .tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);
  padding:7px 15px;border-radius:999px;font-weight:600;font-size:14px;margin-bottom:24px}
.hero h1{font-size:clamp(38px,7vw,68px);line-height:1.02;font-weight:900;letter-spacing:-1.5px;max-width:14ch}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p.sub{font-size:clamp(17px,2.4vw,21px);color:var(--ink-soft);max-width:48ch;margin:22px 0 32px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
/* steps */
.section{padding:54px 0}
.section h2{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-1px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
@media(max-width:780px){.grid3{grid-template-columns:1fr}}
.step .n{font-family:'Fraunces';font-weight:900;font-size:40px;color:var(--gold);line-height:1}
.step h3{font-size:20px;margin:10px 0 6px}
/* pricing */
.price-box{max-width:380px;margin:30px auto 0;text-align:center}
.price-amt{font-family:'Fraunces';font-weight:900;font-size:64px;letter-spacing:-2px}
.price-amt span{font-size:24px;color:var(--ink-soft)}
.checks{text-align:left;margin:20px 0;display:flex;flex-direction:column;gap:10px}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks .ok{color:var(--green);font-weight:800}
/* rating page */
.rate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.rate-card{background:#fff;border:1.5px solid var(--border);border-radius:28px;padding:40px 30px;max-width:440px;width:100%;text-align:center;box-shadow:var(--shadow)}
.rate-card h2{font-size:28px;font-weight:700;margin:14px 0 4px}
.stars{display:flex;justify-content:center;gap:8px;margin:26px 0}
.stars .s{font-size:46px;cursor:pointer;color:#E2DAC9;transition:transform .12s,color .12s;line-height:1}
.stars .s:hover{transform:scale(1.18)}
.stars .s.on{color:var(--gold-bright)}
.biz-logo{width:74px;height:74px;border-radius:20px;object-fit:cover;margin:0 auto;display:block;background:#F1EADB;border:1.5px solid var(--border)}
/* dashboard */
.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:24px}
@media(max-width:860px){.dash-grid{grid-template-columns:1fr}}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ch{font-family:'Fraunces';font-size:20px;margin-bottom:12px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-grid .btn{justify-content:center;padding:12px 10px;font-size:14px}
.btn-grid:has(.btn:nth-child(3)){grid-template-columns:1fr 1fr 1fr}
/* mobile */
@media(max-width:680px){
  nav .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;gap:8px}
  nav .wrap>div{flex-wrap:wrap}
  .btn{padding:11px 16px;font-size:15px}
  .logo{font-size:19px}
  .stat-row{grid-template-columns:1fr 1fr}
  .stat .v{font-size:26px}
  .card{padding:18px}
  .hero{padding:44px 0 24px}
  .btn-grid{grid-template-columns:1fr 1fr}
  .btn-grid:has(.btn:nth-child(3)){grid-template-columns:1fr 1fr}
}
.stat{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.stat .v{font-family:'Fraunces';font-weight:900;font-size:32px}
.stat .l{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.linkbox{display:flex;gap:8px;align-items:center;background:#F7F1E6;border:1.5px dashed var(--border);border-radius:12px;padding:10px 12px;font-size:14px;word-break:break-all}
#qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:14px;border:1.5px solid var(--border)}
.fb-item{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#FFFDF8}
.fb-item .st{color:var(--gold);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--border)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;box-shadow:var(--shadow)}
.toast.show{opacity:1}
.center-narrow{max-width:440px;margin:48px auto;padding:0 22px}
.tabbar{display:flex;gap:8px;margin:8px 0 4px}
.tabbar button{flex:0 0 auto;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fff;cursor:pointer}
.tabbar button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
footer{padding:40px 0;text-align:center;color:var(--ink-soft);font-size:14px;border-top:1px solid var(--border);margin-top:40px}
.err{color:var(--red);font-size:14px;font-weight:600;margin-top:8px}
.ok-msg{color:var(--green);font-size:14px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG  — live Supabase project "Review Booster"
   ============================================================ */
const SUPABASE_URL = "https://xekldhdrchlryytmxnvr.supabase.co";
const SUPABASE_KEY = "sb_publishable_ltxSWvgwVDyBU6XIf19png_2Jhn_j49";
const PRICE_DEFAULT = 249;        // INR / month
const RAZORPAY_KEY  = "";         // <-- apna Razorpay key_id daalo (test/live). Khaali = demo mode.

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const $ = (s,r=document)=>r.querySelector(s);

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)+'-'+Math.random().toString(36).slice(2,6);}
function ratingUrl(slug){return location.origin+location.pathname+'?r='+slug;}

/* ============================================================
   ROUTER
   ============================================================ */
async function route(){
  const params = new URLSearchParams(location.search);
  const r = params.get('r');
  if(r){ return renderRating(r); }          // public rating page
  const hash = (location.hash||'#/').replace('#','');
  const { data:{ session } } = await sb.auth.getSession();

  if(hash.startsWith('/dashboard') || hash.startsWith('/admin')){
    if(!session) return (location.hash='#/signup');
    return renderApp(session, hash);
  }
  if(hash.startsWith('/signup')) return renderAuth(session);
  return renderLanding(session);
}
window.addEventListener('hashchange',route);
sb.auth.onAuthStateChange(()=>{ /* keep UI in sync on login/logout */ });

/* ============================================================
   LANDING
   ============================================================ */
function renderLanding(session){
  app.innerHTML = `
  <nav><div class="wrap">
    <div class="logo"><span class="star">★</span> Review Booster</div>
    <div style="display:flex;gap:10px">
      <a class="btn btn-ghost" href="#/signup">${session?'Dashboard':'Login'}</a>
      <a class="btn btn-gold" href="#/signup">Free Trial</a>
    </div>
  </div></nav>

  <header class="hero"><div class="wrap">
    <div class="tag reveal">★★★★★ <span class="muted" style="font-weight:600">Local businesses ke liye</span></div>
    <h1 class="reveal" style="animation-delay:.05s">Zyada <em>genuine</em> Google reviews. Apne aap.</h1>
    <p class="sub reveal" style="animation-delay:.12s">Customer ek QR scan kare, star de — khush customer seedha Google par, naraz customer ka feedback sirf aapko. Aapki rating chamakti hai, naye customer aate hain.</p>
    <div class="hero-cta reveal" style="animation-delay:.18s">
      <a class="btn btn-gold" href="#/signup">14 din free shuru karein →</a>
      <a class="btn btn-ghost" href="#how">Kaise kaam karta hai</a>
    </div>
  </div></header>

  <section class="section" id="how"><div class="wrap">
    <h2>3 step me set</h2>
    <p class="muted">Koi technical jhanjhat nahi. 5 minute me live.</p>
    <div class="grid3">
      <div class="card step"><div class="n">1</div><h3>Sign up + link daalo</h3><p class="muted">Apna business naam aur Google review link daalein. Aapko ek QR + link milega.</p></div>
      <div class="card step"><div class="n">2</div><h3>QR lagao</h3><p class="muted">Counter, table ya bill par QR print karke lagayein. Customer scan kare.</p></div>
      <div class="card step"><div class="n">3</div><h3>Rating badhe</h3><p class="muted">4-5★ wale seedha Google par, kam wale ka feedback private. Rating upar.</p></div>
    </div>
  </div></section>

  <section class="section"><div class="wrap">
    <div class="card">
      <h2 style="text-align:center">Ek hi simple plan</h2>
      <div class="price-box">
        <div class="price-amt">₹${PRICE_DEFAULT}<span>/mahina</span></div>
        <div class="checks">
          <div><span class="ok">✓</span> Unlimited customer ratings</div>
          <div><span class="ok">✓</span> QR code + sharable link</div>
          <div><span class="ok">✓</span> Auto-copy review (customer ko likhna nahi padta)</div>
          <div><span class="ok">✓</span> Private negative feedback dashboard</div>
          <div><span class="ok">✓</span> 14-din free trial, card ki zarurat nahi</div>
        </div>
        <a class="btn btn-gold" style="width:100%;justify-content:center" href="#/signup">Free trial shuru karein</a>
      </div>
    </div>
  </div></section>

  <footer>Review Booster · Local businesses ki rating badhane wala tool · India</footer>`;
}

/* ============================================================
   AUTH (signup / login)
   ============================================================ */
function renderAuth(session){
  if(session){ location.hash='#/dashboard'; return; }
  app.innerHTML = `
  <nav><div class="wrap"><a class="logo" href="#/"><span class="star">★</span> Review Booster</a></div></nav>
  <div class="center-narrow">
    <div class="card">
      <div class="tabbar">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabSignup">Naya account</button>
      </div>
      <h2 id="authTitle" style="font-size:24px;margin:14px 0 18px">Wapas aapka swaagat</h2>
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="aap@email.com"></div>
      <div class="field"><label>Password</label><input id="pass" type="password" placeholder="••••••••"></div>
      <button id="authBtn" class="btn btn-gold" style="width:100%;justify-content:center">Login</button>
      <div id="authMsg"></div>
      <p class="muted" style="font-size:13px;margin-top:14px">Tip: agar signup ke baad login na ho, to Supabase → Authentication → Providers → Email me "Confirm email" off kar dein (testing ke liye).</p>
    </div>
  </div>`;

  let mode='login';
  const setMode=(m)=>{mode=m;
    $('#tabLogin').classList.toggle('active',m==='login');
    $('#tabSignup').classList.toggle('active',m==='signup');
    $('#authTitle').textContent = m==='login'?'Wapas aapka swaagat':'Apna account banayein';
    $('#authBtn').textContent = m==='login'?'Login':'Account banayein';
    $('#authMsg').innerHTML='';
  };
  $('#tabLogin').onclick=()=>setMode('login');
  $('#tabSignup').onclick=()=>setMode('signup');

  $('#authBtn').onclick=async()=>{
    const email=$('#email').value.trim(), pass=$('#pass').value;
    const msg=$('#authMsg'); msg.innerHTML='';
    if(!email||!pass){msg.innerHTML='<div class="err">Email aur password dono daalein.</div>';return;}
    $('#authBtn').disabled=true;
    try{
      if(mode==='signup'){
        const {data,error}=await sb.auth.signUp({email,password:pass});
        if(error)throw error;
        if(data.session){ location.hash='#/dashboard'; }
        else{ msg.innerHTML='<div class="ok-msg">Account ban gaya! Agar email confirm maange to email check karein, warna upar wala tip follow karein, phir Login karein.</div>'; setMode('login'); }
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
        location.hash='#/dashboard';
      }
    }catch(e){ msg.innerHTML='<div class="err">'+(e.message||'Kuch galat hua')+'</div>'; }
    $('#authBtn').disabled=false;
  };
}

/* ============================================================
   APP SHELL (loads business, decides dashboard vs admin vs onboarding)
   ============================================================ */
async function renderApp(session, hash){
  app.innerHTML = shell(`<div class="card"><p class="muted">Load ho raha hai…</p></div>`);
  const uid = session.user.id;
  let { data:bizRows } = await sb.from('businesses').select('*').eq('owner_user_id',uid).order('created_at').limit(1);
  let biz = bizRows && bizRows[0];

  if(!biz){ return renderOnboarding(session); }

  if(hash.startsWith('/admin')){
    if(biz.role!=='admin'){ location.hash='#/dashboard'; return; }
    return renderAdmin(session,biz);
  }
  return renderDashboard(session,biz);
}

function shell(inner, biz){
  const adminLink = biz && biz.role==='admin' ? `<a class="btn btn-ghost" href="#/admin">Admin Panel</a>`:'';
  return `
  <nav><div class="wrap">
    <a class="logo" href="#/"><span class="star">★</span> Review Booster</a>
    <div style="display:flex;gap:10px">
      ${biz?`<a class="btn btn-ghost" href="#/dashboard">Dashboard</a>`:''}
      ${adminLink}
      <button class="btn btn-ghost" id="logoutBtn">Logout</button>
    </div>
  </div></nav>
  <div class="wrap" style="padding-top:26px;padding-bottom:40px">${inner}</div>`;
}
function bindLogout(){ const b=$('#logoutBtn'); if(b) b.onclick=async()=>{await sb.auth.signOut();location.hash='#/';}; }

/* ============================================================
   ONBOARDING
   ============================================================ */
function renderOnboarding(session){
  app.innerHTML = shell(`
    <div style="max-width:520px;margin:0 auto">
      <h2 style="font-size:30px;letter-spacing:-1px">Apna business set karein</h2>
      <p class="muted" style="margin-bottom:20px">Bas teen cheezein. Iske baad aapka rating link aur QR ready.</p>
      <div class="card">
        <div class="field"><label>Business ka naam</label><input id="bname" placeholder="Sharma Cafe"></div>
        <div class="field"><label>Google review link <span class="muted" style="font-weight:400">(Google par "Write a review" ka link)</span></label><input id="gurl" placeholder="https://g.page/r/..."></div>
        <div class="field"><label>Suggested review <span class="muted" style="font-weight:400">(customer ke liye ready text — auto copy hoga)</span></label><textarea id="srev" rows="3" placeholder="Bahut achha experience raha, khaana aur service dono lajawab. Recommend karta hoon!"></textarea></div>
        <button id="saveBiz" class="btn btn-gold" style="width:100%;justify-content:center">Set karein →</button>
        <div id="obMsg"></div>
      </div>
    </div>`);
  bindLogout();
  $('#saveBiz').onclick=async()=>{
    const name=$('#bname').value.trim(); if(!name){$('#obMsg').innerHTML='<div class="err">Business naam daalein.</div>';return;}
    $('#saveBiz').disabled=true;
    const {error}=await sb.from('businesses').insert({
      owner_user_id:session.user.id, name, slug:slugify(name),
      google_review_url:$('#gurl').value.trim()||null,
      suggested_review:$('#srev').value.trim()||null
    });
    if(error){
      if(error.code==='23505'){ toast('Business pehle se set hai'); location.hash='#/dashboard'; route(); return; }
      $('#obMsg').innerHTML='<div class="err">'+error.message+'</div>';$('#saveBiz').disabled=false;return;
    }
    toast('Business set ho gaya 🎉'); location.hash='#/dashboard'; route();
  };
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard(session,biz){
  const { data:fb=[] } = await sb.from('feedbacks').select('*').eq('business_id',biz.id).order('created_at',{ascending:false});
  const total=fb.length;
  const avg = total? (fb.reduce((a,b)=>a+b.stars,0)/total).toFixed(1):'—';
  const onGoogle = fb.filter(f=>f.redirected).length;
  const negatives = fb.filter(f=>f.stars<=3 && f.comment);
  const planPill = biz.plan==='active'?'<span class="pill pill-active">Active</span>'
                 : biz.plan==='expired'?'<span class="pill pill-expired">Expired</span>'
                 :'<span class="pill pill-trial">Trial</span>';
  const link = ratingUrl(biz.slug);
  // analytics
  const weekAgo = Date.now()-7*864e5;
  const thisWeek = fb.filter(f=>new Date(f.created_at).getTime()>weekAgo).length;
  const dist = [5,4,3,2,1].map(s=>({s,n:fb.filter(f=>f.stars===s).length}));
  const maxN = Math.max(1,...dist.map(d=>d.n));
  const recent = fb.slice(0,8);
  const star=(n)=>'★'.repeat(n)+'<span style="color:#E2DAC9">'+'★'.repeat(5-n)+'</span>';

  app.innerHTML = shell(`
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px">
      <div><h2 style="font-size:clamp(24px,6vw,30px);letter-spacing:-1px">${biz.name}</h2>
      <p class="muted">${planPill} &nbsp; ${biz.plan==='trial'?('Trial khatam: '+new Date(biz.trial_ends_at).toLocaleDateString('en-IN')):''}</p></div>
      <button class="btn btn-green" id="upgradeBtn">Upgrade — ₹${biz.custom_price||PRICE_DEFAULT}/mo</button>
    </div>

    <div class="stat-row" style="margin-top:18px">
      <div class="stat"><div class="v">${total}</div><div class="l">Total ratings</div></div>
      <div class="stat"><div class="v">${avg}</div><div class="l">Average stars</div></div>
      <div class="stat"><div class="v">${onGoogle}</div><div class="l">Google par bheje</div></div>
      <div class="stat"><div class="v">${thisWeek}</div><div class="l">Is hafte</div></div>
    </div>

    <div class="dash-grid">
      <div class="card">
        <h3 class="ch">Rating link & QR</h3>
        <div class="linkbox"><span id="lnk">${link}</span></div>
        <div class="btn-grid" style="margin:10px 0 16px">
          <button class="btn btn-ghost" id="copyLink">Link copy</button>
          <button class="btn btn-ghost" id="waBtn">WhatsApp</button>
          <button class="btn btn-ghost" id="previewBtn">Preview</button>
        </div>
        <div id="qrbox"></div>
        <div class="btn-grid" style="margin-top:12px">
          <button class="btn btn-gold" id="dlQr">QR download</button>
          <button class="btn btn-gold" id="posterBtn">Poster print</button>
        </div>
      </div>

      <div class="card">
        <h3 class="ch">Star breakdown</h3>
        ${dist.map(d=>`
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
            <span style="width:30px;font-weight:700;color:var(--gold)">${d.s}★</span>
            <div style="flex:1;background:#F1EADB;border-radius:8px;height:14px;overflow:hidden">
              <div style="width:${d.n/maxN*100}%;height:100%;background:var(--gold-bright)"></div>
            </div>
            <span style="width:28px;text-align:right;font-weight:700">${d.n}</span>
          </div>`).join('')}
        ${total===0?'<p class="muted" style="font-size:14px;margin-top:8px">Abhi koi rating nahi. QR share karke pehli rating laayein 🚀</p>':''}
      </div>
    </div>

    <div class="dash-grid">
      <div class="card">
        <h3 class="ch">Recent ratings</h3>
        ${recent.length? recent.map(f=>`<div class="fb-item">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span class="st">${star(f.stars)}</span>
              ${f.redirected?'<span class="pill pill-active">Google ✓</span>':'<span class="pill pill-trial">Private</span>'}
            </div>
            ${f.comment?`<div style="margin-top:6px">${f.comment}</div>`:''}
            <div class="muted" style="font-size:12px;margin-top:4px">${new Date(f.created_at).toLocaleString('en-IN')}</div>
          </div>`).join('') : '<p class="muted">Abhi koi rating nahi aayi.</p>'}
      </div>

      <div class="card">
        <h3 class="ch">Settings</h3>
        <div class="field"><label>Google review link</label><input id="eGurl" value="${biz.google_review_url||''}" placeholder="https://g.page/r/..."></div>
        <div class="field"><label>Suggested review (auto-copy text)</label><textarea id="eSrev" rows="3">${biz.suggested_review||''}</textarea></div>
        <button class="btn btn-green" id="saveSettings" style="width:100%;justify-content:center">Save</button>
        <div id="setMsg"></div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <h3 class="ch" style="margin-bottom:6px">Private feedback (1–3★)</h3>
      <p class="muted" style="font-size:14px;margin-bottom:14px">Ye Google par nahi gaye. Inhe theek karke customer wapas laayein.</p>
      ${negatives.length? negatives.map(n=>`<div class="fb-item"><span class="st">${star(n.stars)}</span> — ${n.comment} <div class="muted" style="font-size:12px;margin-top:4px">${new Date(n.created_at).toLocaleString('en-IN')}</div></div>`).join('')
        : '<p class="muted">Abhi koi negative feedback nahi. 👌</p>'}
    </div>
  `, biz);
  bindLogout();

  // QR
  new QRCode($('#qrbox'),{text:link,width:180,height:180,colorDark:'#16271D',colorLight:'#ffffff'});

  $('#copyLink').onclick=()=>{navigator.clipboard.writeText(link);toast('Link copy ho gaya');};
  $('#waBtn').onclick=()=>{const msg=encodeURIComponent(`Namaste! ${biz.name} aane ke liye shukriya 🙏 Apna experience yahan batayein: ${link}`);window.open('https://wa.me/?text='+msg,'_blank');};
  $('#previewBtn').onclick=()=>window.open(link,'_blank');
  $('#dlQr').onclick=()=>{const c=$('#qrbox canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=biz.slug+'-qr.png';a.click();};
  $('#posterBtn').onclick=()=>printPoster(biz,link);

  $('#saveSettings').onclick=async()=>{
    $('#saveSettings').disabled=true;
    const {error}=await sb.from('businesses').update({google_review_url:$('#eGurl').value.trim()||null,suggested_review:$('#eSrev').value.trim()||null}).eq('id',biz.id);
    $('#setMsg').innerHTML = error?'<div class="err">'+error.message+'</div>':'<div class="ok-msg">Save ho gaya ✓</div>';
    $('#saveSettings').disabled=false;
  };

  $('#upgradeBtn').onclick=()=>startCheckout(biz);
}

/* ============================================================
   PRINTABLE POSTER
   ============================================================ */
function printPoster(biz,link){
  const c=$('#qrbox canvas'); const img=c?c.toDataURL('image/png'):'';
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>${biz.name} — QR Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Hanken+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Hanken Grotesk',sans-serif;text-align:center;padding:40px 30px;color:#16271D}
    h1{font-family:'Fraunces',serif;font-size:46px;font-weight:900;margin:0 0 6px}
    .sub{font-size:22px;color:#42554a;margin-bottom:28px}
    img{width:300px;height:300px;border:8px solid #16271D;border-radius:24px;padding:10px;background:#fff}
    .cta{font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin-top:26px}
    .stars{color:#F4B62E;font-size:40px;letter-spacing:4px;margin-top:10px}
    @media print{button{display:none}}
    button{margin-top:30px;padding:12px 26px;font-size:16px;font-weight:700;border:none;border-radius:12px;background:#F4B62E;cursor:pointer}
  </style></head><body>
    <h1>${biz.name}</h1>
    <div class="sub">Aapka experience kaisa raha?</div>
    <img src="${img}">
    <div class="cta">Scan karke rate karein</div>
    <div class="stars">★ ★ ★ ★ ★</div>
    <button onclick="window.print()">Print</button>
  </body></html>`);
  w.document.close();
}

/* ============================================================
   RAZORPAY CHECKOUT (demo-aware)
   ============================================================ */
function startCheckout(biz){
  const amount=(biz.custom_price||PRICE_DEFAULT);
  if(!RAZORPAY_KEY){
    toast('Demo mode: Razorpay key set karein (CONFIG me) to live payment chale');
    alert('Payment demo mode hai.\n\nLive karne ke liye:\n1. Razorpay account banao, key_id lo\n2. index.html ke CONFIG me RAZORPAY_KEY daalo\n3. Recurring/verification ke liye ek chhota server (Supabase Edge Function) lagana behtar hai.\n\nAbhi ke liye amount: ₹'+amount+'/mo');
    return;
  }
  const rzp=new Razorpay({
    key:RAZORPAY_KEY, amount:amount*100, currency:'INR',
    name:'Review Booster', description:biz.name+' — monthly plan',
    handler:async(resp)=>{
      await sb.from('businesses').update({plan:'active'}).eq('id',biz.id);
      await sb.from('subscriptions').insert({business_id:biz.id,status:'active',current_period_end:new Date(Date.now()+30*864e5).toISOString()});
      toast('Payment ho gaya 🎉'); route();
    },
    theme:{color:'#E0A526'}
  });
  rzp.open();
}

/* ============================================================
   ADMIN PANEL (only role=admin) — sare clients + custom price
   ============================================================ */
async function renderAdmin(session,me){
  app.innerHTML = shell(`<div class="card"><p class="muted">Clients load ho rahe hain…</p></div>`, me);
  bindLogout();
  const { data:all=[] } = await sb.from('businesses').select('*').order('created_at',{ascending:false});
  const { data:fb=[] } = await sb.from('feedbacks').select('business_id,stars,redirected');
  const statBy={};
  fb.forEach(f=>{const s=statBy[f.business_id]||(statBy[f.business_id]={n:0,sum:0,g:0});s.n++;s.sum+=f.stars;if(f.redirected)s.g++;});

  const rows = all.map(b=>{
    const s=statBy[b.id]||{n:0,sum:0,g:0};
    const avg=s.n?(s.sum/s.n).toFixed(1):'—';
    const pill=b.plan==='active'?'pill-active':b.plan==='expired'?'pill-expired':'pill-trial';
    return `<tr>
      <td><b>${b.name}</b><div class="muted" style="font-size:12px">${b.slug}</div></td>
      <td><span class="pill ${pill}">${b.plan}</span></td>
      <td>${s.n}</td><td>${avg}</td><td>${s.g}</td>
      <td><div style="display:flex;gap:6px;align-items:center">
        <input data-id="${b.id}" class="cp" value="${b.custom_price||''}" placeholder="${PRICE_DEFAULT}" style="width:90px;padding:7px 9px">
        <button class="btn btn-ghost saveCp" data-id="${b.id}" style="padding:7px 12px">Save</button>
      </div></td>
    </tr>`;
  }).join('');

  const totalRev = all.filter(b=>b.plan==='active').reduce((a,b)=>a+(b.custom_price||PRICE_DEFAULT),0);

  app.innerHTML = shell(`
    <h2 style="font-size:30px;letter-spacing:-1px">Admin Panel</h2>
    <p class="muted" style="margin-bottom:8px">Saare clients, unke stats, aur per-client pricing.</p>
    <div class="stat-row" style="margin:14px 0 22px">
      <div class="stat"><div class="v">${all.length}</div><div class="l">Total clients</div></div>
      <div class="stat"><div class="v">${all.filter(b=>b.plan==='active').length}</div><div class="l">Paying</div></div>
      <div class="stat"><div class="v">₹${totalRev}</div><div class="l">Monthly revenue</div></div>
    </div>
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>Business</th><th>Plan</th><th>Ratings</th><th>Avg</th><th>On Google</th><th>Price (₹/mo)</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="6" class="muted">Abhi koi client nahi.</td></tr>'}</tbody>
      </table>
    </div>
    <p class="muted" style="font-size:13px;margin-top:14px">Price khaali = default ₹${PRICE_DEFAULT}. Bade client ko zyada set karein.</p>
  `, me);
  bindLogout();

  document.querySelectorAll('.saveCp').forEach(btn=>btn.onclick=async()=>{
    const id=btn.dataset.id;
    const val=document.querySelector('.cp[data-id="'+id+'"]').value.trim();
    const price = val===''?null:parseInt(val,10);
    if(val!=='' && (isNaN(price)||price<0)){toast('Sahi number daalein');return;}
    const {error}=await sb.from('businesses').update({custom_price:price}).eq('id',id);
    toast(error?('Error: '+error.message):'Price update ✓');
  });
}

/* ============================================================
   PUBLIC RATING PAGE  (?r=slug)  — anonymous customers
   ============================================================ */
async function renderRating(slug){
  app.innerHTML = `<div class="rate-wrap"><div class="rate-card"><p class="muted">Load ho raha hai…</p></div></div>`;
  const { data, error } = await sb.rpc('get_business_public',{p_slug:slug});
  const biz = data && data[0];
  if(error || !biz){
    app.innerHTML = `<div class="rate-wrap"><div class="rate-card"><h2>Hmm 🤔</h2><p class="muted">Ye link sahi nahi lag raha. Business se dobara link maangein.</p></div></div>`;
    return;
  }
  renderStarStage(biz);
}

function renderStarStage(biz){
  app.innerHTML = `
  <div class="rate-wrap"><div class="rate-card">
    ${biz.logo_url?`<img class="biz-logo" src="${biz.logo_url}">`:`<div class="biz-logo" style="display:flex;align-items:center;justify-content:center;font-family:Fraunces;font-weight:900;font-size:30px;color:var(--gold)">${biz.name.charAt(0)}</div>`}
    <h2>${biz.name}</h2>
    <p class="muted">Aapka experience kaisa raha?</p>
    <div class="stars" id="stars">
      ${[1,2,3,4,5].map(i=>`<span class="s" data-v="${i}">★</span>`).join('')}
    </div>
    <p class="muted" style="font-size:14px">Star tap karein</p>
  </div></div>`;

  const starEls=[...document.querySelectorAll('#stars .s')];
  const paint=v=>starEls.forEach(e=>e.classList.toggle('on',+e.dataset.v<=v));
  starEls.forEach(e=>{
    e.onmouseenter=()=>paint(+e.dataset.v);
    e.onclick=()=>handleStars(biz,+e.dataset.v);
  });
  $('#stars').onmouseleave=()=>paint(0);
}

async function handleStars(biz,stars){
  if(stars>=4){
    // happy path: copy suggested review, log, redirect to Google
    if(biz.suggested_review){ try{ await navigator.clipboard.writeText(biz.suggested_review); }catch(e){} }
    await sb.rpc('submit_feedback',{p_business_id:biz.id,p_stars:stars,p_comment:null,p_redirected:true});
    app.innerHTML = `<div class="rate-wrap"><div class="rate-card">
      <div style="font-size:54px">🙏</div>
      <h2>Shukriya!</h2>
      <p class="muted">${biz.suggested_review?'Ek ready review aapke clipboard me copy ho gaya hai — Google par sirf <b>paste</b> karein.':'Aapko Google review page par le ja rahe hain…'}</p>
      <a class="btn btn-gold" style="width:100%;justify-content:center;margin-top:18px" href="${biz.google_review_url||'#'}" id="goG">Google par review likhein →</a>
    </div></div>`;
    if(biz.google_review_url){ setTimeout(()=>{ window.location.href=biz.google_review_url; },1500); }
    return;
  }
  // 1-3 stars: private feedback
  app.innerHTML = `<div class="rate-wrap"><div class="rate-card">
    <div class="stars" style="margin:6px 0 14px">${'★'.repeat(stars)}${'☆'.repeat(5-stars).split('').map(()=>'<span style="color:#E2DAC9">★</span>').join('')}</div>
    <h2>Sorry experience accha nahi raha</h2>
    <p class="muted">Batayein kya behtar ho sakta tha? Ye sirf owner dekhega.</p>
    <textarea id="cmt" rows="4" style="margin:16px 0" placeholder="Aapki baat..."></textarea>
    <button class="btn btn-green" id="sendFb" style="width:100%;justify-content:center">Bhejein</button>
  </div></div>`;
  $('#sendFb').onclick=async()=>{
    $('#sendFb').disabled=true;
    await sb.rpc('submit_feedback',{p_business_id:biz.id,p_stars:stars,p_comment:$('#cmt').value.trim()||null,p_redirected:false});
    app.innerHTML = `<div class="rate-wrap"><div class="rate-card"><div style="font-size:54px">🙏</div><h2>Shukriya!</h2><p class="muted">Aapki feedback owner tak pahunch gayi. Hum behtar karenge.</p></div></div>`;
  };
}

/* boot */
route();
</script>
</body>
</html>
